<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open source maintained by Synapse</title>
<meta name="description" content="Documentation for jsonrpcserver and jsonrpcclient, Python libraries for JSON-RPC 2.0, maintained by Synapse.">
<link rel="canonical" href="https://bensynapse.github.io/">
<style>
  :root { color-scheme: light dark; --fg: #111113; --muted: #52525b; --line: #e4e4e7; --accent: #059669; --bg: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f4f4f5; --muted: #a1a1aa; --line: #27272a; --accent: #10b981; --bg: #0b0b0c; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 4rem 1rem; }
  h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
  p { color: var(--muted); margin: 0 0 2rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-top: 1px solid var(--line); padding: 1rem 0; }
  li:last-child { border-bottom: 1px solid var(--line); }
  a { color: var(--accent); font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
  span { display: block; color: var(--muted); font-size: .95rem; }
  footer { margin-top: 2rem; font-size: .9rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Open source maintained by Synapse</h1>
  <p>Python libraries for JSON-RPC 2.0. Both are on PyPI.</p>
  <ul>
    <li><a href="/jsonrpcserver/">jsonrpcserver</a><span>Process incoming JSON-RPC 2.0 requests in Python.</span></li>
    <li><a href="/jsonrpcclient/">jsonrpcclient</a><span>Create JSON-RPC 2.0 requests and parse responses in Python.</span></li>
  </ul>
  <footer>Maintained by <a href="https://synapsereality.io/">Synapse</a>.</footer>
</main>
</body>
</html>
